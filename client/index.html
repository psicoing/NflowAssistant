    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9998;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 30%, #1e1b4b 0%, #0f172a 60%, #020617 100%);

        border-radius: 16px;

      #boot-splash .boot-splash-logos {

        flex-direction: column;
        align-items: center;
      }
      #boot-splash .boot-splash-title {

        font-family: Poppins, system-ui, sans-serif;

  <body>
    <div id="boot-splash">
